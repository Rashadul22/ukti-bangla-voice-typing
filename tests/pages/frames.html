<!doctype html><meta charset="utf-8"><title>page with many small iframes, like ads</title>
<p>Ten small iframes and no text box.</p>
<div id="frames"></div>
<script>
  const n = +(new URLSearchParams(location.search).get('n') || 10);
  for (let i = 0; i < n; i++) {
    const f = document.createElement('iframe');
    f.src = 'blank.html';
    f.style.cssText = 'width:300px;height:250px';
    document.getElementById('frames').append(f);
  }
</script>
