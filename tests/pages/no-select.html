<!doctype html><meta charset="utf-8"><title>editor that will not keep a selection</title>
<script src="mimic.js"></script>
<!-- Adversarial. A paste-only model editor, like the Lexical archetype,
     that also snaps the caret back to the end a task after any range
     selection appears. Nothing can replace its whole content, so the right
     outcome is: write nothing, keep the user's text, and say so. A paste
     made anyway lands at the caret and leaves the sentence in twice. -->
<div id="ed" contenteditable="true" style="border:1px solid #888;min-height:3em;width:30em"></div>
<p><button id="elsewhere">elsewhere</button></p>
<script>
  const el = document.getElementById('ed');
  let model = '';
  const history = [];
  const render = caret => { el.textContent = model; if (caret != null) placeCaret(el, caret); };
  const commit = next => { model = next; history.push(next); };

  document.addEventListener('selectionchange', () => {
    setTimeout(() => {
      const s = getSelection();
      if (s.rangeCount && !s.isCollapsed && el.contains(s.getRangeAt(0).commonAncestorContainer)) {
        placeCaret(el, model.length);
      }
    }, 0);
  });
  el.addEventListener('beforeinput', e => {
    const out = applyTyping(e, model, liveOffsets(el, model.length));
    if (!out) return;
    e.preventDefault();
    commit(out.model);
    render(out.caret);
  });
  el.addEventListener('paste', e => {
    e.preventDefault();
    const text = e.clipboardData.getData('text/plain');
    const [s, en] = liveOffsets(el, model.length);
    commit(model.slice(0, s) + text + model.slice(en));
    render(s + text.length);
  });
  el.addEventListener('input', () => {
    setTimeout(() => { if (el.textContent !== model) render(model.length); }, 0);
  });

  window.mimic = {
    el, kind: 'no-select',
    model: () => model,
    history: () => history.slice(),
    setText(s) { commit(s); el.focus(); render(s.length); history.length = 0; }
  };
</script>
